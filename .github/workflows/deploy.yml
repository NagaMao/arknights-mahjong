name: Deploy to OSS

on:
  push:
    branches: [main, master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Install ossutil
        run: |
          curl -o install.sh https://gosspublic.alicdn.com/ossutil/install.sh
          sudo bash install.sh
          ossutil

      - name: Upload to OSS
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_ENDPOINT: oss-cn-hongkong.aliyuncs.com
        run: |
          # 先做一次安全校验，确认密钥确实被传入（不会打印密钥明文）
          if [ -z "$OSS_ACCESS_KEY_ID" ] || [ -z "$OSS_ACCESS_KEY_SECRET" ]; then
            echo "ERROR: OSS_ACCESS_KEY_ID or OSS_ACCESS_KEY_SECRET is empty. Please check GitHub Secrets."
            exit 1
          fi
          
          # 使用环境变量执行上传
          ossutil cp -r -f dist/ oss://ark-mj-hk/ --exclude "*.map" -e "$OSS_ENDPOINT" -i "$OSS_ACCESS_KEY_ID" -k "$OSS_ACCESS_KEY_SECRET"
