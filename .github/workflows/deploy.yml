name: Deploy to OSS

on:
  push:
    branches: [main, master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Install ossutil
        run: |
          # 1. 下载官方安装脚本
          curl -o install.sh https://gosspublic.alicdn.com/ossutil/install.sh
          
          # 2. 执行安装
          sudo bash install.sh
          
          # 3. 验证安装
          ossutil version
          
          # 4. 配置 ossutil (直接使用 ossutil 命令)
          ossutil config -e oss-cn-hongkong.aliyuncs.com -i ${{ secrets.OSS_ACCESS_KEY_ID }} -k ${{ secrets.OSS_ACCESS_KEY_SECRET }} -L CH

      - name: Upload to OSS
        run: |
          # 注意这里使用的是 ossutil 而不是 ./ossutil64
          ossutil cp -r -f dist/ oss://ark-mj-hk/ --exclude "*.map"
