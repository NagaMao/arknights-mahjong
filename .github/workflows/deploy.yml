name: Deploy to OSS

on:
  push:
    branches: [main, master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Install ossutil
        run: |
          curl -o install.sh https://gosspublic.alicdn.com/ossutil/install.sh
          sudo bash install.sh
          ossutil

      - name: Upload to OSS
        run: |
          ossutil cp -r -f dist/ oss://ark-mj-hk/ --exclude "*.map" -e oss-cn-hongkong.aliyuncs.com -i ${{ secrets.OSS_ACCESS_KEY_ID }} -k ${{ secrets.OSS_ACCESS_KEY_SECRET }}
